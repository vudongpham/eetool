[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eetool"
version = "0.2.1"
description = "Google Earth Engine data (Landsat/Sentinel-2, Satellite Embedding, Sentinel-1) as (time, H, W, channel) numpy arrays on your own pixel grid."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "vudongpham" }]
keywords = ["earth-engine", "remote-sensing", "landsat", "sentinel-2", "sentinel-1", "gis"]
dependencies = [
    "earthengine-api>=0.1.390",
    "numpy>=1.22",
    "rasterio>=1.3",
    "affine>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "xarray", "geopandas"]
xarray = ["xarray"]
# only for vector formats other than .gpkg / .shp (GeoJSON, FlatGeobuf, GeoParquet, ...)
vector = ["pyogrio>=0.7"]

[project.urls]
Homepage = "https://github.com/vudongpham/eetool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
